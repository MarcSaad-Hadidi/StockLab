name: ci

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: restore
        working-directory: backend
        run: dotnet restore StockLab.sln

      - name: audit nuget packages
        working-directory: backend
        shell: bash
        run: |
          report="${RUNNER_TEMP}/nuget-audit.json"
          dotnet list StockLab.sln package --vulnerable --include-transitive --format json --output-version 1 > "$report"
          findings="$(jq '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select((.vulnerabilities // []) | length > 0)] | length' "$report")"

          if [ "$findings" -gt 0 ]; then
            echo "::error::NuGet vulnerabilities detected in ${findings} package entries."
            jq '.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select((.vulnerabilities // []) | length > 0)' "$report"
            exit 1
          fi

      - name: build
        working-directory: backend
        run: dotnet build StockLab.sln --configuration Release --no-restore

      - name: test
        working-directory: backend
        run: dotnet test StockLab.sln --configuration Release --no-build --no-restore --filter "FullyQualifiedName!~SqlServer" --logger trx --results-directory test-results

  backend-sql-server:
    name: backend sql server tests
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      STOCKLAB_TEST_LOCALDB: '1'
      STOCKLAB_PRICE_ALERTS_SQL_CONNECTION: ''
      DOTNET_CLI_UI_LANGUAGE: en

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: test sql result validator
        run: python -m unittest discover --start-directory .github/scripts/tests --verbose

      - name: start sql server localdb
        shell: pwsh
        run: |
          $instances = @(& SqlLocalDB info)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect SQL Server LocalDB.' }
          if ($instances -contains 'MSSQLLocalDB') {
            & SqlLocalDB start MSSQLLocalDB
          } else {
            & SqlLocalDB create MSSQLLocalDB -s
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot start SQL Server LocalDB.' }
          & SqlLocalDB info MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the SQL Server LocalDB instance.' }

      - name: restore
        working-directory: backend
        run: dotnet restore StockLab.sln

      - name: build
        working-directory: backend
        run: dotnet build StockLab.sln --configuration Release --no-restore

      - name: discover sql server cases
        shell: pwsh
        run: |
          $discovery = & dotnet test backend/StockLab.sln --configuration Release --no-build --no-restore --list-tests --filter 'FullyQualifiedName~SqlServer'
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server test discovery failed.' }
          $tests = @($discovery | ForEach-Object { $_.Trim() } | Where-Object { $_.StartsWith('StockLab.UnitTests.') })
          if ($tests.Count -eq 0) { throw 'No SQL Server tests were discovered.' }
          $directory = Join-Path $env:RUNNER_TEMP 'sql-server-results'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $tests | Set-Content -Encoding utf8 -Path (Join-Path $directory 'expected-tests.txt')
          Write-Output "Discovered $($tests.Count) SQL Server cases."

      - name: test sql server
        run: dotnet test backend/StockLab.sln --configuration Release --no-build --no-restore --filter "FullyQualifiedName~SqlServer" --logger "trx;LogFileName=sql-server.trx" --results-directory "${{ runner.temp }}/sql-server-results"

      - name: require every sql server case to pass
        if: always()
        run: python .github/scripts/verify_sql_test_results.py --trx "${{ runner.temp }}/sql-server-results/sql-server.trx" --expected-tests "${{ runner.temp }}/sql-server-results/expected-tests.txt"

      - name: upload sql server results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sql-server-results
          path: ${{ runner.temp }}/sql-server-results
          if-no-files-found: warn

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        working-directory: frontend
        run: npm ci

      - name: audit npm packages
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

      - name: test
        working-directory: frontend
        run: npm test

  ml:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: install dependencies
        working-directory: ml
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: install dependency audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: audit python packages
        working-directory: ml
        run: pip-audit -r requirements.txt

      - name: test
        working-directory: ml
        run: python -m pytest
