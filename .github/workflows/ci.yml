name: ci

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: restore
        working-directory: backend
        run: dotnet restore StockLab.sln

      - name: build
        working-directory: backend
        run: dotnet build StockLab.sln --configuration Release --no-restore

      - name: test
        working-directory: backend
        run: dotnet test StockLab.sln --configuration Release --no-build --no-restore --logger trx --results-directory test-results

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

      - name: test
        working-directory: frontend
        run: npm test

  ml:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: install dependencies
        working-directory: ml
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: test
        working-directory: ml
        run: python -m pytest
